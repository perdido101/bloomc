name: Deploy Bloom to GitHub Pages

on:
  push:
    branches: [claude/vortika-platformer-build-2krb29]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages source must stay set to "GitHub Actions" in the repo settings —
      # in legacy branch mode, GitHub's own Jekyll build would publish the raw
      # repo source over this artifact (symptom: the site serves /src/main.ts
      # and hangs on the boot screen).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
